<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <header class="site-header">
      <div class="site-header__inner">
        <a class="site-brand" href="home.html">Campus Portal</a>
        <nav class="site-nav">
          <a href="home.html">Home</a>
          <a href="#">News</a>
          <a href="#">Events</a>
          <a href="#">Contact</a>
        </nav>
      </div>
    </header>

    <main class="auth-page">
      <section class="auth-card">
        <h1>Create Account</h1>

        <form class="auth-form">
          <label for="reg-username"><b>Username</b></label>
          <input type="text" id="reg-username" placeholder="Choose a username" required>

          <label for="reg-email"><b>Email</b></label>
          <input type="email" id="reg-email" placeholder="Enter your email" required>

          <label for="reg-password"><b>Password</b></label>
          <input type="password" id="reg-password" placeholder="Create a password" required>

          <label for="reg-confirm"><b>Confirm Password</b></label>
          <input type="password" id="reg-confirm" placeholder="Repeat your password" required>

          <button type="submit">Register</button>
        </form>

        <form action="index.html" method="get" class="secondary-form">
          <button type="submit" class="registerbtn">Back to login</button>
        </form>
      </section>
    </main>

    <footer class="site-footer">
      <div class="site-footer__inner">
        <span>2026 Campus Portal</span>
        <span>All rights reserved</span>
      </div>
    </footer>

    <script>
      const registerForm = document.querySelector(".auth-form");

      if (registerForm) {
        registerForm.addEventListener("submit", (event) => {
          event.preventDefault();

          const username = document.getElementById("reg-username").value.trim();
          const email = document.getElementById("reg-email").value.trim();
          const password = document.getElementById("reg-password").value;
          const confirmPassword = document.getElementById("reg-confirm").value;

          if (password !== confirmPassword) {
            alert("Passwords do not match.");
            return;
          }

          const userData = {
            username,
            email,
            password,
          };

          const usersRaw = localStorage.getItem("users");
          const users = usersRaw ? JSON.parse(usersRaw) : [];
          users.push(userData);
          localStorage.setItem("users", JSON.stringify(users));
          alert("Registration successful. You can now log in.");
          window.location.assign("index.html");
        });
      }
    </script>
  </body>
</html>
