
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main class="auth-page">
      <section class="auth-card">
        <h1>Login</h1>

        <form class="auth-form">
          <label for="uname"><b>Username</b></label>
          <input id="uname" type="text" placeholder="Enter Username" required>

          <label for="psw"><b>Password</b></label>
          <input id="psw" type="password" placeholder="Enter Password" required>

          <button type="submit" id="login-btn">Login</button>
          <label class="remember">
            <input type="checkbox" checked="checked"> Remember me
          </label>

          <div class="auth-actions">
            <button type="reset" class="cancelbtn">Cancel</button>
          </div>
        </form>

        <form action="register.html" method="get" class="secondary-form">
          <button type="submit" class="registerbtn">Not registered yet</button>
        </form>
      </section>
    </main>

    <script>
      const loginForm = document.querySelector(".auth-form");

      if (loginForm) {
        loginForm.addEventListener("submit", (event) => {
          event.preventDefault();

          const username = document.getElementById("uname").value.trim();
          const password = document.getElementById("psw").value;
          const usersRaw = localStorage.getItem("users");

          if (!usersRaw) {
            alert("No registered user found. Please create an account first.");
            window.location.assign("register.html");
            return;
          }

          const users = JSON.parse(usersRaw);
          const matchedUser = users.find(
            (user) => user.username === username && user.password === password
          );

          if (matchedUser) {
            window.location.assign("home.html");
            return;
          }

          alert("Invalid username or password.");
        });
      }
    </script>
  </body>
</html>
