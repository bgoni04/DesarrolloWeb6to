<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Landing</title>
		<link rel="stylesheet" href="style.css">
	</head>
	<body>
		<div id="app-header"></div>

		<main class="landing">
			<section class="hero">
				<img src="pokelogo.png" alt="Logo Pokemon" class="rounded-rectangle">
				<div>
					<h1>Desarrollo Web</h1>
					<p>Pokedex Bruno Arturo Goñi Flores.</p>
				</div>
			</section>

			<form action="index.html" method="get" class="home-actions">
				<button type="submit" class="registerbtn">Back to login</button>
			</form>

			<section class="pokemon-section">
				<div class="pokemon-toolbar">
					<h2>Pokémon Index</h2>
					<select id="pokemon-type-filter" class="pokemon-type-filter" aria-label="Filter Pokémon by type">
						<option value="all">All types</option>
					</select>
					<div class="pokemon-controls">
						<button id="pokemon-prev" type="button" class="registerbtn">Previous</button>
						<span id="pokemon-page-label">Index 1</span>
						<button id="pokemon-next" type="button">Next</button>
					</div>
				</div>
				<p id="pokemon-status" class="pokemon-status">Loading Pokémon...</p>
				<div id="pokemon-grid" class="pokemon-grid"></div>
			</section>

			<section class="battle-section">
				<div class="battle-toolbar">
					<h2>Battle Arena</h2>
					<p>Elige dos Pokemon y avanza la pelea turno por turno.</p>
				</div>

				<div class="battle-selectors">
					<div class="battle-picker">
						<label for="pokemon-one-input">Pokemon 1</label>
						<input id="pokemon-one-input" list="pokemon-name-options" type="text" placeholder="Ej. pikachu o 25">
					</div>
					<div class="battle-picker">
						<label for="pokemon-two-input">Pokemon 2</label>
						<input id="pokemon-two-input" list="pokemon-name-options" type="text" placeholder="Ej. charizard o 6">
					</div>
				</div>

				<datalist id="pokemon-name-options"></datalist>

				<div class="battle-actions">
					<button id="battle-load-btn" type="button">Cargar Pokemon</button>
					<button id="battle-next-turn-btn" type="button" disabled>Siguiente turno</button>
					<button id="battle-reset-btn" type="button" class="registerbtn" disabled>Reiniciar batalla</button>
				</div>

				<p id="battle-status" class="pokemon-status">Selecciona dos Pokemon para comenzar.</p>

				<div id="battle-stage" class="battle-stage"></div>
				<ol id="battle-log" class="battle-log"></ol>
				<div id="battle-winner" class="battle-winner"></div>
			</section>
		</main>

		<div id="app-footer"></div>

		<script src="auth.js"></script>
		<script src="layout.js"></script>
		<script src="battle.js"></script>
		<script>
			Layout.mountLayout({
				activePage: "home",
				requireAuth: true,
			});
		</script>
	</body>
</html>
