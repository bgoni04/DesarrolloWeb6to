<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Landing</title>
		<link rel="stylesheet" href="style.css">
	</head>
	<body>
		<div id="app-header"></div>

		<main class="landing">
			<section class="hero">
				<img src="pokelogo.png" alt="Logo Pokemon" class="rounded-rectangle">
				<div>
					<h1>Desarrollo Web</h1>
					<p>Pokedex Bruno Arturo Goñi Flores.</p>
				</div>
			</section>

			<form action="index.html" method="get" class="home-actions">
				<button type="submit" class="registerbtn">Back to login</button>
			</form>

			<section class="pokemon-section">
				<div class="pokemon-toolbar">
					<h2>Pokémon Index</h2>
					<div class="pokemon-controls">
						<button id="pokemon-prev" type="button" class="registerbtn">Previous</button>
						<span id="pokemon-page-label">Index 1</span>
						<button id="pokemon-next" type="button">Next</button>
					</div>
				</div>
				<p id="pokemon-status" class="pokemon-status">Loading Pokémon...</p>
				<div id="pokemon-grid" class="pokemon-grid"></div>
			</section>
		</main>

		<div id="app-footer"></div>

		<script src="auth.js"></script>
		<script src="layout.js"></script>
		<script>
			Layout.mountLayout({
				activePage: "home",
				requireAuth: true,
			});
		</script>
	</body>
</html>
