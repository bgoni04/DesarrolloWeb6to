<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Landing</title>
		<link rel="stylesheet" href="style.css">
	</head>
	<body>
		<div id="app-header"></div>

		<main class="landing">
			<section class="hero">
				<img src="teclogo.png" alt="Tec De Monterrey" class="rounded-rectangle">
				<div>
					<h1>Welcome</h1>
					<p>Explore the latest updates, events, and highlights.</p>
				</div>
			</section>

			<form action="index.html" method="get" class="home-actions">
				<button type="submit" class="registerbtn">Back to login</button>
			</form>

			<section class="image-grid">
				<div class="image-slot">Image 1</div>
				<div class="image-slot">Image 2</div>
				<div class="image-slot">Image 3</div>
				<div class="image-slot">Image 4</div>
				<div class="image-slot">Image 5</div>
				<div class="image-slot">Image 6</div>
			</section>

			<section class="feature-row">
				<div class="feature">
					<div class="image-slot">Banner</div>
				</div>
				<div class="feature">
					<h2>Featured</h2>
					<p>bruh.</p>
				</div>
			</section>
		</main>

		<div id="app-footer"></div>

		<script src="auth.js"></script>
		<script src="layout.js"></script>
		<script>
			Layout.mountLayout({
				activePage: "home",
				requireAuth: true,
			});
		</script>
	</body>
</html>
